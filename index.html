<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Streaming HUB</title>

    <meta name="theme-color" content="#060b12">
    <meta name="description" content="Streaming HUB med strømmetjenester, vær og siste nyheter fra VG.">

    <style>
        :root {
            --bg: #030d17;
            --bg-2: #081821;
            --panel: rgba(17, 24, 39, 0.7);
            --panel-soft: rgba(17, 24, 39, 0.9);
            --tile: rgba(18, 31, 45, 0.92);
            --tile-alt: rgba(14, 20, 31, 0.8);
            --text: #eef5ff;
            --muted: rgba(255,255,255,0.65);
            --muted-2: rgba(255,255,255,0.38);
            --line: rgba(255,255,255,0.05);
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 18px 22px 10px;
        }

        .page {
            width: 100%;
            max-width: 1460px;
            min-height: calc(100vh - 30px);
        }

        .layout {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr) 360px;
            gap: 26px;
            align-items: start;
        }

        /* Weather column stretches to bottom */
        .weather-area {
            padding-top: 16px;
            min-height: calc(100vh - 36px);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .weather-head {
            margin: 0 0 18px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
        }

        .weather-box {
            width: 100%;
            max-width: 220px;
            color: var(--text);
            background: transparent;
            border: none;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* push update to bottom */
            flex: 1 1 auto;
        }

        .weather-top {
            /* keeps icon + temp at top */
        }

        .weather-temp-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .weather-temp {
            font-size: 3.2rem; /* reduced slightly to fit hourly */
            line-height: 0.96;
            font-weight: 700;
            letter-spacing: -0.06em;
            display: flex;
            align-items: flex-start;
        }

        .weather-temp .degree {
            font-size: 1.05rem;
            display: inline-block;
            transform: translateY(12px);
            margin-left: 2px;
        }

        .weather-feels {
            color: var(--muted);
            font-size: 1.0rem;
            margin-top: 8px;
        }

        .weather-meta {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 12px;
            color: var(--muted);
            font-size: 0.97rem;
        }

        .weather-meta strong {
            display: block;
            color: var(--text);
            font-size: 0.9rem;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .weather-updated {
            margin-top: 12px;
            font-size: 0.82rem;
            color: var(--muted-2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            max-width: 220px;
        }

        .weather-updated button,
        .news-footer button {
            background: rgba(255,255,255,0.02);
            color: #dfeeff;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 6px 10px;
            font: inherit;
            font-size: 0.76rem;
            cursor: pointer;
        }

        /* hourly forecast (vertical list, no slider) */
        .hourly-forecast {
            display: flex;
            flex-direction: column; /* stack vertically */
            gap: 10px; /* slightly larger spacing */
            margin-top: 12px;
            padding-bottom: 6px;
            overflow: visible; /* no slider */
        }

        .hour-card {
            width: 100%;
            max-width: 240px; /* a bit wider to fit larger cards */
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            padding: 12px 14px; /* increased padding for bigger appearance */
            text-align: left;
            font-size: 1rem; /* slightly larger text */
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hour-left { display:flex; align-items:center; gap:12px; }
        .hour-icon { font-size: 1.35rem; }
        .hour-temp { font-weight: 700; font-size: 1.05rem; }

        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 8px;
            min-height: calc(100vh - 36px);
        }

        h1.title {
            margin: 6px 0 0;
            font-size: 2.4rem; /* smaller title per request */
            line-height: 1.05;
            letter-spacing: -0.03em;
            font-weight: 800;
            color: var(--text);
            text-align: center;
        }

        .services-block {
            width: 100%;
            margin-top: 18px;
            padding-right: 10px;
            display:flex;
            justify-content:center; /* center the grid */
        }

        .section-header {
            margin: 0 0 12px;
            font-size: 1rem;
            color: var(--muted);
            font-weight: 700;
            width:100%;
            max-width:700px;
            text-align:left;
        }

        /* fixed-width columns so spacing is symmetric and grid is centered */
        .service-grid {
            display: grid;
            grid-template-columns: repeat(4, 160px); /* increased column width */
            gap: 16px 28px;
            width: 100%;
            max-width: 800px; /* adjusted to match wider columns */
            margin: 0 auto; /* center horizontally */
            justify-content: center; /* center the grid block */
            justify-items: center;
        }

        .service-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 160px; /* increased card width */
            min-height: 140px; /* increased height to fit larger logo */
            border-radius: 10px;
            background: rgba(18, 31, 45, 0.92);
            border: 1px solid rgba(255,255,255,0.04);
            text-decoration: none;
            color: var(--text);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.01);
            padding: 14px 12px 12px; /* slightly more padding */
            transition: transform 0.12s ease, filter 0.12s ease;
        }

        .service-card:hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
        }

        .service-logo {
            width: 72px; /* larger logo */
            height: 72px;
            object-fit: contain;
            display: block;
            margin-bottom: 12px;
        }

        .service-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f0f5ff;
        }

        /* News column: full-height, show 7 articles and make list scroll to bottom */
        .news-area {
            padding-top: 10px;
            min-height: calc(100vh - 36px);
            display:flex;
            flex-direction:column;
        }

        .news-panel {
            width: 100%;
            min-height: calc(100vh - 36px);
            background: transparent;
            border: none;
            color: var(--text);
            padding: 0;
            display:flex;
            flex-direction:column;
        }

        .news-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-right: 6px;
        }

        .news-header h2 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow:auto;
            padding-right: 6px;
            /* make it stretch to bottom */
            flex: 1 1 auto;
        }

        .news-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            text-decoration: none;
            min-height: 86px; /* larger full-size item */
            padding: 6px 0 6px 0;
            border-bottom: 1px solid var(--line);
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-thumb {
            width: 96px;
            height: 72px;
            border-radius: 8px;
            object-fit: cover;
            background: rgba(255,255,255,0.06);
            flex-shrink: 0;
        }

        .news-text {
            flex: 1;
            min-width: 0;
        }

        .news-title {
            font-size: 0.98rem;
            line-height: 1.3;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .news-time {
            color: var(--muted-2);
            font-size: 0.78rem;
            margin-top: 6px;
        }

        .news-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            color: var(--muted-2);
            font-size: 0.8rem;
            padding-top: 8px;
            border-top: 1px solid var(--line);
        }

        .bottom-text {
            margin-top: 22px;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 8px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
        }

        .bottom-text a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
        }

        @media (max-width: 1100px) {
            .layout {
                grid-template-columns: 200px 1fr 280px;
                gap: 20px;
            }
            .service-grid {
                grid-template-columns: repeat(3, minmax(120px, 1fr));
                max-width: 720px;
            }
            h1.title { font-size: 2.1rem; }
        }

        @media (max-width: 768px) {
            body { padding: 14px; }
            .layout {
                grid-template-columns: 1fr;
            }
            .weather-area,
            .news-area { min-height: auto; }
            .service-grid { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
            h1.title { font-size: 1.8rem; }
        }
    </style>
</head>

<body>

    <script>
        const WEATHER = {
            city: 'Oslo',
            latitude: 59.9139,
            longitude: 10.7522
        };

        // Update weather every 15 minutes
        const WEATHER_INTERVAL = 15 * 60 * 1000;
        const NEWS_API_URL = 'https://streaminghub-news.eskil-sundby.workers.dev/news';
        const NEWS_INTERVAL = 15 * 60 * 1000;
        const MAX_NEWS_ARTICLES = 7; // show 7 items

        // map weather code -> emoji icon (you can replace with SVGs later)
        function weatherIcon(code) {
            if (code === 0) return '☀️';
            if (code === 1 || code === 2) return '🌤️';
            if (code === 3) return '☁️';
            if (code >= 45 && code <= 48) return '🌫️';
            if (code >= 51 && code <= 67) return '🌧️';
            if (code >= 71 && code <= 77) return '❄️';
            if (code >= 80 && code <= 82) return '🌦️';
            if (code >= 95) return '⛈️';
            return '🌡️';
        }

        // live clock under the weather (and in the main title area)
        function updateClock() {
            const timeStr = new Date().toLocaleTimeString('no-NO');
            const el = document.getElementById('clock');
            if (el) el.textContent = timeStr;
            const main = document.getElementById('main-clock');
            if (main) main.textContent = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function updateWeather() {
            const tempEl = document.getElementById('temperature');
            const feelsEl = document.getElementById('feels-like');
            const windEl = document.getElementById('wind');
            const humEl = document.getElementById('humidity');
            const updatedEl = document.getElementById('weather-updated');
            const iconEl = document.getElementById('weather-icon');
            const hourlyContainer = document.getElementById('hourly-forecast');

            try {
                const url = 'https://api.open-meteo.com/v1/forecast' +
                    `?latitude=${WEATHER.latitude}` +
                    `&longitude=${WEATHER.longitude}` +
                    '&hourly=temperature_2m,apparent_temperature,weathercode,relativehumidity_2m' +
                    '&current_weather=true' +
                    '&timezone=Europe%2FOslo';

                const response = await fetch(url);
                if (!response.ok) throw new Error('Værserveren svarte med feil');

                const data = await response.json();
                const current = data.current_weather ?? data.current;
                if (!current) throw new Error('Ingen værdata');

                // Open-Meteo returns temperatures in °C and windspeed in m/s by default for hourly/current_weather
                // Use the returned values directly and label wind as m/s
                const temp = Number.isFinite(current.temperature) ? Math.round(current.temperature) : (current.temperature_2m ? Math.round(current.temperature_2m) : '--');
                const weatherCode = current.weathercode ?? current.weather_code ?? 0;

                // apparent temperature: try to find it in hourly arrays for the current hour
                let apparentVal = null;
                if (data.hourly && Array.isArray(data.hourly.time) && Array.isArray(data.hourly.apparent_temperature)) {
                    const nowKey = current.time || data.current_weather?.time || data.current?.time;
                    const idx = data.hourly.time.indexOf(nowKey);
                    if (idx >= 0) apparentVal = data.hourly.apparent_temperature[idx];
                }
                if (apparentVal == null && current.apparent_temperature != null) apparentVal = current.apparent_temperature;

                if (tempEl) tempEl.innerHTML = `${temp}<span class="degree">°</span>`;
                if (feelsEl) feelsEl.textContent = `Føles som ${Number.isFinite(apparentVal) ? Math.round(apparentVal) : '--'}°`;

                // wind in m/s
                const windVal = current.windspeed ?? current.wind_speed_10m ?? current.windspeed_10m ?? '--';
                if (windEl) windEl.textContent = `${Number.isFinite(windVal) ? (Math.round(windVal * 10) / 10) : '--'} m/s`;

                // humidity from hourly if available, else fallback
                let humVal = '--';
                if (data.hourly && Array.isArray(data.hourly.time) && Array.isArray(data.hourly.relativehumidity_2m)) {
                    const nowKey = current.time || data.current_weather?.time || data.current?.time;
                    const idx = data.hourly.time.indexOf(nowKey);
                    if (idx >= 0) humVal = data.hourly.relativehumidity_2m[idx];
                }
                if (humVal === '--') humVal = current.relativehumidity_2m ?? current.relative_humidity_2m ?? '--';
                if (humEl) humEl.textContent = `${humVal} %`;

                if (iconEl) iconEl.textContent = weatherIcon(weatherCode);

                // build vertical hourly forecast (next 9 hours)
                if (hourlyContainer && data.hourly && Array.isArray(data.hourly.time)) {
                    hourlyContainer.innerHTML = '';
                    const times = data.hourly.time;
                    const temps = data.hourly.temperature_2m || [];
                    const codes = data.hourly.weathercode || [];

                    // find index of current time in hourly.time
                    const nowKey = current.time || data.current_weather?.time || data.current?.time;
                    let idx = times.indexOf(nowKey);
                    if (idx === -1) {
                        // fallback: find first time >= now
                        const now = new Date().toISOString().slice(0,13); // quick hour prefix
                        idx = times.findIndex(t => t.startsWith(now));
                        if (idx === -1) idx = 0;
                    }

                    const start = idx + 1; // next hour
                    const count = 9; // show next 9 hours
                    for (let i = start; i < Math.min(start + count, times.length); i++) {
                        const t = times[i];
                        const hourLabel = new Date(t).toLocaleTimeString('no-NO', { hour: '2-digit' });
                        const tempH = temps[i] != null ? Math.round(temps[i]) : '--';
                        const codeH = codes[i] != null ? codes[i] : null;
                        const ic = codeH != null ? weatherIcon(Number(codeH)) : '';

                        const card = document.createElement('div');
                        card.className = 'hour-card';
                        card.innerHTML = `<div class="hour-left"><div class="hour-icon">${ic}</div><div><div style="font-weight:600">${hourLabel}</div></div></div><div class="hour-temp">${tempH}°</div>`;
                        hourlyContainer.appendChild(card);
                    }
                }

                // update timestamp
                const weatherTime = new Date(current.time || data.current_weather?.time || data.current?.time);
                if (updatedEl && !isNaN(weatherTime.getTime())) {
                    updatedEl.textContent = 'Værdato: ' + weatherTime.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
                }

            } catch (error) {
                console.error('Weather fetch failed:', error);
                const tempEl = document.getElementById('temperature');
                const feelsEl = document.getElementById('feels-like');
                const updatedEl = document.getElementById('weather-updated');
                if (tempEl) tempEl.innerHTML = '--<span class="degree">°</span>';
                if (feelsEl) feelsEl.textContent = 'Føles som --°';
                if (updatedEl) updatedEl.textContent = 'Værdata utilgjengelig';
            }
        }

        async function updateNews(forceFresh = false) {
            const container = document.getElementById('vg-news');
            const updatedEl = document.getElementById('news-updated');
            const refreshBtn = document.getElementById('refresh-news');

            try {
                const endpoint = forceFresh
                    ? `${NEWS_API_URL}?refresh=1&t=${Date.now()}`
                    : `${NEWS_API_URL}?t=${Date.now()}`;

                const response = await fetch(endpoint, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Nyhetsserveren svarte ${response.status}`);
                }

                const data = await response.json();
                let articles = Array.isArray(data.articles) ? data.articles.slice(0) : [];

                // sort by pubDate descending (newest first)
                articles.sort((a, b) => {
                    const ta = a.pubDate ? new Date(a.pubDate).getTime() : 0;
                    const tb = b.pubDate ? new Date(b.pubDate).getTime() : 0;
                    return tb - ta;
                });

                articles = articles.slice(0, MAX_NEWS_ARTICLES);

                if (!container) return;

                if (!articles.length) {
                    container.innerHTML = '<div class="news-item"><div class="news-text"><div class="news-title">Ingen nyheter tilgjengelig</div></div></div>';
                    if (updatedEl) updatedEl.textContent = 'Ingen nyheter';
                    return;
                }

                const fragment = document.createDocumentFragment();
                articles.forEach(article => {
                    const link = document.createElement('a');
                    link.href = article.link || 'https://www.vg.no';
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.className = 'news-item';

                    if (article.image) {
                        const img = document.createElement('img');
                        img.src = article.image;
                        img.alt = article.title || '';
                        img.className = 'news-thumb';
                        link.appendChild(img);
                    }

                    const text = document.createElement('div');
                    text.className = 'news-text';

                    const title = document.createElement('div');
                    title.className = 'news-title';
                    title.textContent = article.title || 'Uten tittel';
                    text.appendChild(title);

                    if (article.pubDate) {
                        const time = document.createElement('div');
                        time.className = 'news-time';
                        const dt = new Date(article.pubDate);
                        time.textContent = Number.isNaN(dt.getTime())
                            ? article.pubDate
                            : dt.toLocaleString('no-NO', {
                                day: '2-digit', month: '2-digit',
                                hour: '2-digit', minute: '2-digit'
                            });
                        text.appendChild(time);
                    }

                    link.appendChild(text);
                    fragment.appendChild(link);
                });

                container.innerHTML = '';
                container.appendChild(fragment);

                if (updatedEl) {
                    const generated = data.updatedAt ? new Date(data.updatedAt) : null;
                    const timeLabel = generated && !Number.isNaN(generated.getTime())
                        ? generated.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' })
                        : 'ukjent tidspunkt';
                    updatedEl.textContent = `${data.stale ? 'Sist lagret' : 'Hentet fra VG'}: ${timeLabel}`;
                }
            } catch (error) {
                console.error('News fetch failed:', error);
                if (container) {
                    container.innerHTML = '<div class="news-item"><div class="news-text"><div class="news-title">Kunne ikke hente nyheter</div></div></div>';
                }
                if (updatedEl) updatedEl.textContent = 'Feil ved oppdatering';
            } finally {
                if (refreshBtn) {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = 'Oppdater';
                }
            }
        }

        // Button handlers
        document.getElementById('refresh-weather').addEventListener('click', function () {
            this.disabled = true;
            this.textContent = 'Oppdaterer...';
            updateWeather().finally(() => {
                this.disabled = false;
                this.textContent = 'Oppdater';
            });
        });

        document.getElementById('refresh-news').addEventListener('click', function () {
            this.disabled = true;
            this.textContent = 'Henter...';
            updateNews(true).finally(() => {
                this.disabled = false;
                this.textContent = 'Oppdater';
            });
        });

        // Initial load + intervals
        updateWeather();
        updateNews();
        setInterval(updateWeather, WEATHER_INTERVAL);
        setInterval(updateNews, NEWS_INTERVAL);
    </script>
</body>

</html>
