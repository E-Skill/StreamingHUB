<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Streaming HUB</title>

    <meta name="theme-color" content="#080c14">
    <meta name="description" content="Streaming HUB med strømmetjenester, vær og siste nyheter fra VG.">

    <style>
        :root {
            --background: #080c14;
            --panel: #111827;
            --panel-hover: #1b263b;
            --border: #1f293d;
            --accent: #3b82f6;
            --text: #ffffff;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 16px;
        }

        h1 {
            margin: 10px 0 30px;
            font-size: 2.8rem;
            letter-spacing: 2px;
            text-align: center;
            color: #f8fafc;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 920px;
            margin-bottom: 30px;
        }

        .panel {
            background-color: var(--panel);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
            min-width: 0;
        }

        .panel h2 {
            font-size: 1.3rem;
            margin: 0;
            color: #f8fafc;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 18px;
        }

        .panel-logo {
            display: block;
            width: 30px;
            height: 30px;
            max-width: 30px;
            max-height: 30px;
            object-fit: contain;
            flex-shrink: 0;
            border-radius: 6px;
        }

        .panel-status {
            color: var(--muted);
            font-size: 0.78rem;
            margin-top: 16px;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .weather-icon {
            font-size: 3rem;
            line-height: 1;
        }

        .weather-temperature {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .weather-description {
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .weather-detail {
            background: #0b1220;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
        }

        .detail-label {
            color: var(--muted);
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1rem;
            font-weight: 600;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* Change news items to use a flex layout so thumbnails can appear */
        .news-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            text-decoration: none;
            padding: 13px 0;
            border-bottom: 1px solid var(--border);
            transition: color 0.2s ease;
        }

        .news-item:first-child {
            padding-top: 0;
        }

        .news-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .news-item:hover {
            color: #60a5fa;
        }

        .news-thumb {
            width: 88px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
            background: #0b1220;
        }

        .news-content {
            flex: 1 1 auto;
            min-width: 0; /* allow text truncation inside flex */
        }

        .news-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .news-time {
            display: block;
            color: var(--muted);
            font-size: 0.75rem;
            margin-top: 5px;
        }

        .news-message {
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .news-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }

        .refresh-button {
            color: #93c5fd;
            background: #172554;
            border: 1px solid #1d4ed8;
            border-radius: 8px;
            padding: 8px 12px;
            font: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .refresh-button:hover:not(:disabled) {
            background: #1e3a8a;
        }

        .refresh-button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .section-title {
            width: 100%;
            max-width: 920px;
            font-size: 1.1rem;
            color: #cbd5e1;
            margin: 0 0 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 920px;
        }

        .card {
            background-color: var(--panel);
            border: 2px solid var(--border);
            border-radius: 16px;
            text-align: center;
            padding: 26px 15px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 135px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
            transition:
                transform 0.2s ease,
                background-color 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .card:hover {
            background-color: var(--panel-hover);
            border-color: var(--accent);
            transform: scale(1.04);
            box-shadow: 0 10px 22px rgba(59, 130, 246, 0.3);
        }

        .card img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            margin-bottom: 14px;
            border-radius: 8px;
        }

        .card span {
            font-size: 1.05rem;
            font-weight: 600;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 12px;
            }

            .card {
                padding: 20px 8px;
                min-height: 120px;
            }

            .card img {
                width: 48px;
                height: 48px;
            }

            .card span {
                font-size: 0.9rem;
            }

            .news-thumb {
                width: 72px;
                height: 52px;
            }
        }

        @media (max-width: 420px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .panel {
                padding: 17px;
            }

            .news-thumb {
                width: 64px;
                height: 46px;
            }
        }
    </style>
</head>

<body>

    <h1>Streaming HUB</h1>

    <div class="dashboard">

        <section class="panel">
            <div class="panel-header">
                <h2 id="weather-location">Været i Oslo</h2>
            </div>

            <div class="weather-main">
                <div class="weather-icon" id="weather-icon">☁️</div>

                <div>
                    <div class="weather-temperature" id="temperature">-- °C</div>
                    <div class="weather-description" id="weather-description">Henter værdata...</div>
                </div>
            </div>

            <div class="weather-details">
                <div class="weather-detail">
                    <div class="detail-label">Vind</div>
                    <div class="detail-value" id="wind">-- km/t</div>
                </div>

                <div class="weather-detail">
                    <div class="detail-label">Luftfuktighet</div>
                    <div class="detail-value" id="humidity">-- %</div>
                </div>
            </div>

            <div class="news-footer">
                <div class="panel-status" id="weather-updated">Venter på værdata...</div>
                <button type="button" class="refresh-button" id="refresh-weather">Oppdater</button>
            </div>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>VG</h2>
                <a href="https://www.vg.no" target="_blank" rel="noopener noreferrer" aria-label="Åpne VG.no">
                    <img src="Images/vg.png" alt="VG-logo" class="panel-logo">
                </a>
            </div>

            <div class="news-list" id="vg-news" aria-live="polite">
                <div class="news-message">Henter de siste nyhetene fra VG...</div>
            </div>

            <div class="news-footer">
                <div class="panel-status" id="news-updated">Venter på nyheter...</div>
                <button type="button" class="refresh-button" id="refresh-news">Oppdater</button>
            </div>
        </section>

    </div>

    <h2 class="section-title">Strømmetjenester</h2>

    <div class="grid">

        <a href="spotify:" class="card">
            <img src="Images/spotify.png" alt="Spotify">
            <span>Spotify</span>
        </a>

        <a href="https://www.youtube.com" class="card">
            <img src="Images/youtube.png" alt="YouTube">
            <span>YouTube</span>
        </a>

        <a href="https://www.twitch.tv" class="card">
            <img src="Images/twitch.png" alt="Twitch">
            <span>Twitch</span>
        </a>

        <a href="https://www.netflix.com" class="card">
            <img src="Images/netflix.png" alt="Netflix">
            <span>Netflix</span>
        </a>

        <a href="https://www.max.com" class="card">
            <img src="Images/max.png" alt="Max">
            <span>Max (HBO)</span>
        </a>

        <a href="https://www.disneyplus.com" class="card">
            <img src="Images/disneypluss.png" alt="Disney+">
            <span>Disney+</span>
        </a>

        <a href="https://www.primevideo.com" class="card">
            <img src="Images/prime.png" alt="Prime Video">
            <span>Prime Video</span>
        </a>

        <a href="https://tv.nrk.no" class="card">
            <img src="Images/nrk.png" alt="NRK TV">
            <span>NRK TV</span>
        </a>

        <a href="https://play.tv2.no" class="card">
            <img src="Images/tv2.png" alt="TV 2 Play">
            <span>TV 2 Play</span>
        </a>

        <a href="https://www.viaplay.no" class="card">
            <img src="Images/viaplay.png" alt="Viaplay">
            <span>Viaplay</span>
        </a>

        <a href="https://www.strim.no" class="card">
            <img src="Images/strim.png" alt="Strim">
            <span>Strim</span>
        </a>

        <a href="https://www.yr.no" class="card">
            <img src="Images/yr.png" alt="Været">
            <span>Yr</span>
        </a>


    </div>

    <script>
        const WEATHER = {
            city: "Oslo",
            latitude: 59.9139,
            longitude: 10.7522
        };

        const WEATHER_INTERVAL = 5 * 60 * 1000;
        const NEWS_API_URL = "https://streaminghub-news.eskil-sundby.workers.dev/news";

        const NEWS_INTERVAL = 15 * 60 * 1000;
        const MAX_NEWS_ARTICLES = 3;

        async function updateWeather() {
            const temperatureElement = document.getElementById("temperature");
            const descriptionElement = document.getElementById("weather-description");
            const updatedElement = document.getElementById("weather-updated");

            const url =
                "https://api.open-meteo.com/v1/forecast" +
                `?latitude=${WEATHER.latitude}` +
                `&longitude=${WEATHER.longitude}` +
                "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m" +
                "&timezone=Europe%2FOslo";

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Værserveren svarte med en feil.");
                }

                const data = await response.json();
                const current = data?.current;

                if (!current) {
                    throw new Error("Værdata mangler.");
                }

                document.getElementById("weather-location").textContent = `Været i ${WEATHER.city}`;
                temperatureElement.textContent = `${Math.round(current.temperature_2m)} °C`;
                descriptionElement.textContent = describeWeather(current.weather_code);
                document.getElementById("weather-icon").textContent = getWeatherIcon(current.weather_code);
                document.getElementById("wind").textContent = `${current.wind_speed_10m} km/t`;
                document.getElementById("humidity").textContent = `${current.relative_humidity_2m} %`;

                const weatherTime = new Date(current.time);
                updatedElement.textContent =
                    "Værdata: " +
                    weatherTime.toLocaleTimeString("no-NO", {
                        hour: "2-digit",
                        minute: "2-digit"
                    });

            } catch (error) {
                console.error("Feil ved henting av vær:", error);

                if (temperatureElement.textContent === "-- °C") {
                    descriptionElement.textContent = "Kunne ikke hente værdata.";
                }

                updatedElement.textContent = "Værdata er midlertidig utilgjengelig.";
            }
        }

        function describeWeather(code) {
            const descriptions = {
                0: "Klart",
                1: "Hovedsakelig klart",
                2: "Delvis skyet",
                3: "Overskyet",
                45: "Tåke",
                48: "Rimtåke",
                51: "Lett yr",
                53: "Yr",
                55: "Kraftig yr",
                56: "Underkjølt yr",
                57: "Kraftig underkjølt yr",
                61: "Lett regn",
                63: "Regn",
                65: "Kraftig regn",
                66: "Underkjølt regn",
                67: "Kraftig underkjølt regn",
                71: "Lett snøfall",
                73: "Snøfall",
                75: "Kraftig snøfall",
                77: "Snøkorn",
                80: "Lette regnbyger",
                81: "Regnbyger",
                82: "Kraftige regnbyger",
                85: "Lette snøbyger",
                86: "Kraftige snøbyger",
                95: "Tordenvær",
                96: "Tordenvær med hagl",
                99: "Kraftig tordenvær med hagl"
            };

            return descriptions[code] ?? "Ukjente værforhold";
        }

        function getWeatherIcon(code) {
            if (code === 0) return "☀️";
            if (code === 1 || code === 2) return "🌤️";
            if (code === 3) return "☁️";
            if (code === 45 || code === 48) return "🌫️";
            if (code >= 51 && code <= 67) return "🌧️";
            if (code >= 71 && code <= 77) return "❄️";
            if (code >= 80 && code <= 82) return "🌦️";
            if (code === 85 || code === 86) return "🌨️";
            if (code >= 95) return "⛈️";
            return "🌡️";
        }

        let previousNews = [];

        async function updateNews(forceFresh = false) {
            const newsContainer = document.getElementById("vg-news");
            const updatedElement = document.getElementById("news-updated");

            try {
                const endpoint = forceFresh
                    ? `${NEWS_API_URL}?refresh=1&t=${Date.now()}`
                    : `${NEWS_API_URL}?t=${Date.now()}`;

                const response = await fetch(endpoint, { cache: "no-store" });
                if (!response.ok) {
                    let detail = "";
                    try {
                        const errorData = await response.json();
                        detail = errorData.error ? ` ${errorData.error}` : "";
                    } catch (_) {}
                    throw new Error(`Nyhetsserveren svarte HTTP ${response.status}.${detail}`);
                }

                const data = await response.json();
                if (!data || !Array.isArray(data.articles)) {
                    throw new Error("Nyhetsserveren returnerte ugyldige nyhetsdata.");
                }

                const articles = data.articles.slice(0, MAX_NEWS_ARTICLES);
                if (articles.length === 0) {
                    newsContainer.replaceChildren();
                    const message = document.createElement("div");
                    message.className = "news-message";
                    message.textContent = "VG-feeden inneholder ingen tilgjengelige nyheter akkurat nå.";
                    newsContainer.appendChild(message);
                    updatedElement.textContent = "Ingen nyheter tilgjengelig";
                    previousNews = [];
                    return;
                }

                const fragment = document.createDocumentFragment();
                articles.forEach(article => {
                    const link = document.createElement("a");
                    link.className = "news-item";
                    link.href = article.link || "https://www.vg.no";
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";

                    // If there's an image, create a thumbnail element
                    if (article.image) {
                        try {
                            const img = document.createElement('img');
                            img.className = 'news-thumb';
                            img.src = article.image;
                            img.alt = article.title || '';
                            link.appendChild(img);
                        } catch (_) {
                            // if image creation fails, continue without it
                        }
                    }

                    const content = document.createElement("div");
                    content.className = "news-content";

                    const title = document.createElement("div");
                    title.className = "news-title";
                    title.textContent = article.title || "Uten tittel";
                    content.appendChild(title);

                    if (article.pubDate) {
                        const time = document.createElement("span");
                        time.className = "news-time";
                        const date = new Date(article.pubDate);
                        time.textContent = Number.isNaN(date.getTime())
                            ? article.pubDate
                            : date.toLocaleString("no-NO", {
                                day: "2-digit", month: "2-digit",
                                hour: "2-digit", minute: "2-digit"
                            });
                        content.appendChild(time);
                    }

                    link.appendChild(content);
                    fragment.appendChild(link);
                });

                newsContainer.replaceChildren(fragment);
                const generated = data.updatedAt ? new Date(data.updatedAt) : null;
                const timeLabel = generated && !Number.isNaN(generated.getTime())
                    ? generated.toLocaleTimeString("no-NO", { hour: "2-digit", minute: "2-digit" })
                    : "ukjent tidspunkt";
                updatedElement.textContent = `${data.stale ? "Sist lagret" : "Hentet fra VG"}: ${timeLabel}`;
                if (forceFresh && data.fetchedAt) {
                    const fetched = new Date(data.fetchedAt);
                    if (!Number.isNaN(fetched.getTime())) {
                        updatedElement.textContent = `Hentet fra VG: ${fetched.toLocaleTimeString("no-NO", { hour: "2-digit", minute: "2-digit" })}`;
                    }
                }
                previousNews = articles;

            } catch (error) {
                console.error("Feil ved henting av VG-nyheter:", error);
                if (previousNews.length === 0) {
                    const message = document.createElement("div");
                    message.className = "news-message";
                    message.textContent = `Kunne ikke hente nyheter. ${error.message}`;
                    newsContainer.replaceChildren(message);
                }
                updatedElement.textContent = "Feil ved oppdatering";
            }
        }

        const refreshButton = document.getElementById("refresh-news");
        refreshButton.addEventListener("click", async function () {
            if (refreshButton.disabled) return;
            refreshButton.disabled = true;
            refreshButton.textContent = "Henter fra VG...";
            try {
                await updateNews(true);
            } finally {
                refreshButton.disabled = false;
                refreshButton.textContent = "Oppdater";
            }
        });

        const weatherButton = document.getElementById("refresh-weather");
        weatherButton.addEventListener("click", async function () {
            if (weatherButton.disabled) return;
            weatherButton.disabled = true;
            weatherButton.textContent = "Oppdaterer...";
            try {
                await updateWeather();
            } finally {
                weatherButton.disabled = false;
                weatherButton.textContent = "Oppdater";
            }
        });

        updateWeather();
        updateNews();

        setInterval(updateWeather, WEATHER_INTERVAL);
        setInterval(updateNews, NEWS_INTERVAL);
    </script>

</body>

</html>
