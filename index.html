<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Streaming HUB</title>

    <meta name="theme-color" content="#06070a">
    <meta name="description" content="Streaming HUB med strømmetjenester, vær og siste nyheter fra VG.">

    <style>
        :root {
            --background: #0a0e12; /* page background (very dark) */
            --panel-dim: #0e151b;  /* slightly lighter for tiles */
            --panel: #111827; /* fallback panel color */
            --border: rgba(255,255,255,0.02);
            --accent: #3b82f6;
            --text: #ffffff;
            --muted: rgba(255,255,255,0.55);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 36px 24px;
        }

        .stage {
            width: 100%;
            max-width: 1400px;
            min-height: calc(100vh - 72px);
        }

        /* three-column layout: left small, center large, right tall */
        .layout {
            display: grid;
            grid-template-columns: 200px 1fr 420px;
            gap: 28px;
            align-items: start;
        }

        /* Panels that should blend with background (weather + VG) */
        .blend-panel {
            background: var(--background);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 18px;
            box-shadow: none;
        }

        /* Weather tiny card on the left */
        .weather-card {
            width: 200px;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
        }

        .weather-card h3 {
            margin: 0 0 8px;
            font-size: 0.95rem;
            color: #fff;
            font-weight: 700;
        }

        .weather-visual-row {
            display:flex;
            align-items:center;
            gap:12px;
        }

        .weather-icon {
            font-size: 2.6rem;
            line-height: 1;
        }

        .weather-temp {
            font-size: 1.6rem;
            font-weight: 800;
        }

        .weather-feels {
            font-size: 0.9rem;
            color: var(--muted);
            margin-top: 6px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .weather-detail {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .weather-footer {
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-top:12px;
        }

        .refresh-button {
            color: #93c5fd;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 8px;
            padding: 6px 10px;
            font: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .refresh-button:hover:not(:disabled) {
            background: rgba(255,255,255,0.02);
        }

        .refresh-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        /* Center column: title and streaming tiles */
        .center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding-top: 8px;
        }

        h1.title {
            margin: 0;
            font-size: 38px; /* reduced from 48px */
            letter-spacing: 1px;
            font-weight: 800;
            color: #ffffff;
        }

        .services-wrap { width:100%; max-width:760px; }

        .services-row {
            display: flex;
            gap: 28px;
            align-items: center;
            justify-content: center;
            padding-top: 8px;
            flex-wrap:wrap;
        }

        .service-tile {
            width: 140px;
            height: 120px;
            background: var(--panel-dim);
            border-radius: 6px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration:none;
            color:var(--text);
        }

        .service-tile img { width:60px; height:60px; object-fit:contain; margin-bottom:8px; border-radius:6px; }
        .service-tile span { font-size:0.95rem; font-weight:600; }

        /* Right column: VG news - large and tall */
        .vg-panel {
            min-height: 860px; /* made taller */
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-top: 12px;
        }

        .vg-header {
            padding: 10px 18px;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
        }

        .vg-content {
            flex: 1 1 auto;
            overflow: auto;
            padding: 0 18px 18px 18px;
        }

        .news-list { display: flex; flex-direction: column; gap: 8px; }

        .news-item {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 6px;
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .news-title { font-size: 0.95rem; font-weight:700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .news-time { color: var(--muted); font-size: 0.75rem; margin-top: 6px; }

        .news-thumb { width: 90px; height: 70px; background: var(--panel-dim); border-radius: 6px; object-fit: cover; }

        .vg-footer { display:flex; align-items:center; justify-content:space-between; padding:10px 18px 0 18px; }

        @media (max-width: 1100px) {
            .layout { grid-template-columns: 160px 1fr 320px; gap: 18px; }
            h1.title { font-size: 34px; }
            .service-tile { width: 120px; height: 100px; }
        }

        @media (max-width: 800px) {
            .layout { grid-template-columns: 1fr; }
            .center { padding-top: 0; }
            .vg-panel { order: 3; min-height: 240px; }
            .weather-card { order: 1; margin-bottom: 12px; }
        }

    </style>
</head>

<body>
    <div class="stage">
        <div class="layout">

            <!-- left: small weather that blends in -->
            <aside class="blend-panel weather-card">
                <h3>Været</h3>

                <div class="weather-visual-row">
                    <div id="weather-icon" class="weather-icon">☁️</div>
                    <div>
                        <div id="temperature" class="weather-temp">--°</div>
                        <div id="feels-like" class="weather-feels">Føles som --°</div>
                    </div>
                </div>

                <div class="weather-details">
                    <div class="weather-detail">Vind: <span id="wind">-- km/t</span></div>
                    <div class="weather-detail">Luftfuktighet: <span id="humidity">-- %</span></div>
                </div>

                <div class="weather-footer">
                    <div id="weather-updated" class="panel-status" style="font-size:0.78rem;color:var(--muted)">Venter på værdata...</div>
                    <button id="refresh-weather" class="refresh-button">Oppdater</button>
                </div>
            </aside>

            <!-- center: big title + streaming services -->
            <main class="center">
                <h1 class="title">Streaming HUB</h1>

                <div class="services-wrap">
                    <h2 style="font-size:0.95rem;color:var(--muted);margin:0 0 10px 0;font-weight:700">Strømmetjenester</h2>
                    <div class="services-row">
                        <a class="service-tile" href="spotify:">
                            <img src="Images/spotify.png" alt="Spotify">
                            <span>Spotify</span>
                        </a>

                        <a class="service-tile" href="https://www.youtube.com">
                            <img src="Images/youtube.png" alt="YouTube">
                            <span>YouTube</span>
                        </a>

                        <a class="service-tile" href="https://www.twitch.tv">
                            <img src="Images/twitch.png" alt="Twitch">
                            <span>Twitch</span>
                        </a>

                        <a class="service-tile" href="https://www.netflix.com">
                            <img src="Images/netflix.png" alt="Netflix">
                            <span>Netflix</span>
                        </a>

                        <a class="service-tile" href="https://www.max.com">
                            <img src="Images/max.png" alt="Max">
                            <span>Max</span>
                        </a>

                        <a class="service-tile" href="https://www.disneyplus.com">
                            <img src="Images/disneypluss.png" alt="Disney+">
                            <span>Disney+</span>
                        </a>

                        <a class="service-tile" href="https://www.primevideo.com">
                            <img src="Images/prime.png" alt="Prime Video">
                            <span>Prime Video</span>
                        </a>

                        <a class="service-tile" href="https://tv.nrk.no">
                            <img src="Images/nrk.png" alt="NRK TV">
                            <span>NRK TV</span>
                        </a>

                        <a class="service-tile" href="https://play.tv2.no">
                            <img src="Images/tv2.png" alt="TV 2 Play">
                            <span>TV 2 Play</span>
                        </a>

                        <a class="service-tile" href="https://www.viaplay.no">
                            <img src="Images/viaplay.png" alt="Viaplay">
                            <span>Viaplay</span>
                        </a>

                        <a class="service-tile" href="https://www.strim.no">
                            <img src="Images/strim.png" alt="Strim">
                            <span>Strim</span>
                        </a>

                        <a class="service-tile" href="https://www.yr.no">
                            <img src="Images/yr.png" alt="Yr">
                            <span>Yr</span>
                        </a>

                    </div>
                </div>
            </main>

            <!-- right: VG news that blends into background with white text -->
            <aside class="blend-panel vg-panel">
                <div class="vg-header">Vg</div>
                <div class="vg-content" id="vg-news" aria-live="polite">
                    <div class="news-list">
                        <div class="news-item">
                            <div style="flex:1">
                                <div class="news-title">Laster nyheter ...</div>
                                <div class="news-time">--</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="vg-footer">
                    <div id="news-updated" class="panel-status" style="font-size:0.78rem;color:var(--muted)">Venter på nyheter...</div>
                    <button id="refresh-news" class="refresh-button">Oppdater</button>
                </div>
            </aside>

        </div>
    </div>

    <script>
        const WEATHER = { city: "Oslo", latitude: 59.9139, longitude: 10.7522 };
        const WEATHER_INTERVAL = 5 * 60 * 1000;
        const NEWS_API_URL = "https://streaminghub-news.eskil-sundby.workers.dev/news";
        const NEWS_INTERVAL = 15 * 60 * 1000;
        const MAX_NEWS_ARTICLES = 5;

        function setWeatherVisual(icon, tempText, feelsText) {
            const iconEl = document.getElementById('weather-icon');
            const tempEl = document.getElementById('temperature');
            const feelsEl = document.getElementById('feels-like');
            if (iconEl) iconEl.textContent = icon;
            if (tempEl) tempEl.textContent = tempText;
            if (feelsEl) feelsEl.textContent = `Føles som ${feelsText}`;
        }

        async function updateWeather() {
            const updateBtn = document.getElementById('refresh-weather');
            if (updateBtn) { updateBtn.disabled = false; }

            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER.latitude}&longitude=${WEATHER.longitude}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Europe%2FOslo`;
                const r = await fetch(url);
                if (!r.ok) throw new Error('Værserver svarte med feil');
                const data = await r.json();
                const c = data.current;
                if (!c) throw new Error('Ingen værdata');

                const icon = getWeatherIcon(c.weather_code);
                const temp = Number.isFinite(c.temperature_2m) ? `${Math.round(c.temperature_2m)}°` : '--°';
                const feels = Number.isFinite(c.apparent_temperature) ? `${Math.round(c.apparent_temperature)}°` : temp;

                setWeatherVisual(icon, temp, feels);

                const windEl = document.getElementById('wind');
                const humEl = document.getElementById('humidity');
                const updatedEl = document.getElementById('weather-updated');
                if (windEl) windEl.textContent = (c.wind_speed_10m ?? '--') + ' km/t';
                if (humEl) humEl.textContent = (c.relative_humidity_2m ?? '--') + ' %';

                if (updatedEl && c.time) {
                    const weatherTime = new Date(c.time);
                    if (!isNaN(weatherTime.getTime())) {
                        updatedEl.textContent = 'Værdata: ' + weatherTime.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
                    }
                }

            } catch (e) {
                console.error(e);
                const updatedEl = document.getElementById('weather-updated');
                if (updatedEl) updatedEl.textContent = 'Værdata utilgjengelig';
            } finally {
                if (updateBtn) { updateBtn.disabled = false; updateBtn.textContent = 'Oppdater'; }
            }
        }

        function getWeatherIcon(code) {
            if (code === 0) return '☀️';
            if (code === 1 || code === 2) return '🌤️';
            if (code === 3) return '☁️';
            if (code >= 51 && code <= 67) return '🌧️';
            if (code >= 71 && code <= 77) return '❄️';
            if (code >= 80 && code <= 82) return '🌦️';
            if (code >= 95) return '⛈️';
            return '🌡️';
        }

        async function updateNews(forceFresh = false) {
            const container = document.getElementById('vg-news');
            const updatedEl = document.getElementById('news-updated');
            const refreshBtn = document.getElementById('refresh-news');
            if (refreshBtn) { refreshBtn.disabled = true; refreshBtn.textContent = 'Henter...'; }

            try {
                const endpoint = forceFresh ? `${NEWS_API_URL}?refresh=1&t=${Date.now()}` : `${NEWS_API_URL}?t=${Date.now()}`;
                const resp = await fetch(endpoint, { cache: 'no-store' });
                if (!resp.ok) throw new Error('Feil fra nyhets-API');
                const data = await resp.json();
                const articles = Array.isArray(data.articles) ? data.articles.slice(0, MAX_NEWS_ARTICLES) : [];

                if (!articles.length) {
                    container.innerHTML = '<div style="padding:12px;color:var(--muted)">Ingen nyheter tilgjengelig</div>';
                    if (updatedEl) updatedEl.textContent = 'Ingen nyheter';
                    return;
                }

                const list = document.createElement('div');
                list.className = 'news-list';

                for (const art of articles) {
                    const a = document.createElement('a');
                    a.href = art.link || '#';
                    a.className = 'news-item';
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';

                    if (art.image) {
                        const img = document.createElement('img');
                        img.className = 'news-thumb';
                        img.src = art.image;
                        img.alt = art.title || '';
                        a.appendChild(img);
                    }

                    const meta = document.createElement('div');
                    meta.style.flex = '1';

                    const t = document.createElement('div');
                    t.className = 'news-title';
                    t.textContent = art.title || 'Uten tittel';
                    meta.appendChild(t);

                    if (art.pubDate) {
                        const dt = document.createElement('div');
                        dt.className = 'news-time';
                        const d = new Date(art.pubDate);
                        dt.textContent = isNaN(d.getTime()) ? art.pubDate : d.toLocaleString('no-NO', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                        meta.appendChild(dt);
                    }

                    a.appendChild(meta);
                    list.appendChild(a);
                }

                container.innerHTML = '';
                container.appendChild(list);

                if (updatedEl) {
                    const generated = data.updatedAt ? new Date(data.updatedAt) : null;
                    const timeLabel = generated && !isNaN(generated.getTime()) ? generated.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' }) : 'ukjent tidspunkt';
                    updatedEl.textContent = `${data.stale ? 'Sist lagret' : 'Hentet fra VG'}: ${timeLabel}`;
                }

            } catch (e) {
                console.error('Feil ved henting av nyheter:', e);
                if (container) container.innerHTML = '<div style="padding:12px;color:var(--muted)">Kunne ikke hente nyheter</div>';
                if (updatedEl) updatedEl.textContent = 'Feil ved oppdatering';
            } finally {
                if (refreshBtn) { refreshBtn.disabled = false; refreshBtn.textContent = 'Oppdater'; }
            }
        }

        // Button handlers
        document.addEventListener('click', function (ev) {
            if (ev.target && ev.target.id === 'refresh-news') {
                ev.target.disabled = true;
                ev.target.textContent = 'Henter...';
                updateNews(true).finally(() => { ev.target.disabled = false; ev.target.textContent = 'Oppdater'; });
            }

            if (ev.target && ev.target.id === 'refresh-weather') {
                ev.target.disabled = true;
                ev.target.textContent = 'Oppdaterer...';
                updateWeather().finally(() => { ev.target.disabled = false; ev.target.textContent = 'Oppdater'; });
            }
        });

        // Initial load and intervals
        updateWeather();
        updateNews();
        setInterval(updateWeather, WEATHER_INTERVAL);
        setInterval(updateNews, NEWS_INTERVAL);
    </script>

</body>

</html>
