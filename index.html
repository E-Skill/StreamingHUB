<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Streaming HUB</title>

    <meta name="theme-color" content="#06070a">
    <meta name="description" content="Streaming HUB med strømmetjenester, vær og siste nyheter fra VG.">

    <style>
        :root {
            --background: #0a0e12; /* page background (very dark) */
            --panel-dim: #0e151b;  /* slightly lighter for tiles */
            --panel: #111827; /* fallback panel color */
            --border: rgba(255,255,255,0.02);
            --accent: #3b82f6;
            --text: #ffffff;
            --muted: rgba(255,255,255,0.55);
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 36px 24px;
        }

        .stage {
            width: 100%;
            max-width: 1400px;
            min-height: calc(100vh - 72px);
        }

        /* three-column layout: left small, center large, right tall */
        .layout {
            display: grid;
            grid-template-columns: 200px 1fr 360px;
            gap: 28px;
            align-items: start;
        }

        /* Panels that should blend with background (weather + VG) */
        .blend-panel {
            background: var(--background);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 18px;
            box-shadow: none;
        }

        /* Weather tiny card on the left */
        .weather-card {
            width: 200px;
            height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
        }

        .weather-card h3 {
            margin: 0 0 8px;
            font-size: 0.95rem;
            color: #fff;
            font-weight: 700;
        }

        .weather-visual {
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.9);
            font-size: 2.6rem;
        }

        /* Center column: title and streaming tiles */
        .center {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding-top: 16px;
        }

        h1.title {
            margin: 0;
            font-size: 48px;
            letter-spacing: 1px;
            font-weight: 800;
            color: #ffffff;
        }

        .services-row {
            display: flex;
            gap: 36px;
            align-items: center;
            justify-content: center;
            padding-top: 8px;
        }

        .service-tile {
            width: 140px;
            height: 120px;
            background: var(--panel-dim);
            border-radius: 6px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Right column: VG news - large and tall */
        .vg-panel {
            min-height: 640px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 18px;
        }

        .vg-header {
            padding: 10px 18px;
            color: #fff;
            font-weight: 700;
        }

        /* Make news list blend inside the right column with white text for headings */
        .vg-content {
            flex: 1 1 auto;
            overflow: auto;
            padding: 0 18px 18px 18px;
        }

        .news-list { display: flex; flex-direction: column; gap: 8px; }

        .news-item {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px 6px;
            color: #fff;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .news-title { font-size: 0.95rem; font-weight:700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .news-time { color: var(--muted); font-size: 0.75rem; margin-top: 6px; }

        .news-thumb { width: 90px; height: 70px; background: var(--panel-dim); border-radius: 6px; object-fit: cover; }

        /* Subtle responsive adjustments */
        @media (max-width: 1100px) {
            .layout { grid-template-columns: 160px 1fr 300px; gap: 18px; }
            h1.title { font-size: 40px; }
            .service-tile { width: 120px; height: 100px; }
        }

        @media (max-width: 800px) {
            .layout { grid-template-columns: 1fr; }
            .center { padding-top: 0; }
            .vg-panel { order: 3; min-height: 240px; }
            .weather-card { order: 1; margin-bottom: 12px; }
        }

    </style>
</head>

<body>
    <div class="stage">
        <div class="layout">

            <!-- left: small weather that blends in -->
            <aside class="blend-panel weather-card">
                <h3>Været</h3>
                <div class="weather-visual" id="weather-visual">☁️<div style="font-size:12px;margin-left:8px;display:inline-block">21°</div></div>
            </aside>

            <!-- center: big title + streaming services -->
            <main class="center">
                <h1 class="title">Streaming HUB</h1>

                <div style="width:100%;max-width:760px;">
                    <h2 style="font-size:0.95rem;color:var(--muted);margin:0 0 10px 0;font-weight:700">Strømmetjenester</h2>
                    <div class="services-row">
                        <div class="service-tile"></div>
                        <div class="service-tile"></div>
                        <div class="service-tile"></div>
                        <div class="service-tile"></div>
                    </div>
                </div>
            </main>

            <!-- right: VG news that blends into background with white text -->
            <aside class="blend-panel vg-panel">
                <div class="vg-header">Vg</div>
                <div class="vg-content" id="vg-news" aria-live="polite">
                    <div class="news-list">
                        <!-- news items will be injected here by the existing script -->
                        <div class="news-item">
                            <div style="flex:1">
                                <div class="news-title">Laster nyheter ...</div>
                                <div class="news-time">--</div>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

        </div>
    </div>

    <script>
        /* Keep the existing weather/news script behavior but adapt some selectors used above. */

        const WEATHER = { city: "Oslo", latitude: 59.9139, longitude: 10.7522 };
        const WEATHER_INTERVAL = 5 * 60 * 1000;
        const NEWS_API_URL = "https://streaminghub-news.eskil-sundby.workers.dev/news";
        const NEWS_INTERVAL = 15 * 60 * 1000;
        const MAX_NEWS_ARTICLES = 5;

        function setWeatherVisual(icon, tempText) {
            const el = document.getElementById('weather-visual');
            if (!el) return;
            el.textContent = icon + ' ' + tempText;
        }

        async function updateWeather() {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${WEATHER.latitude}&longitude=${WEATHER.longitude}&current=temperature_2m,weather_code&timezone=Europe%2FOslo`;
                const r = await fetch(url);
                if (!r.ok) throw new Error('Værserver svarte med feil');
                const data = await r.json();
                const c = data.current;
                if (!c) throw new Error('Ingen værdata');
                const icon = getWeatherIcon(c.weather_code);
                setWeatherVisual(icon, `${Math.round(c.temperature_2m)}°`);
            } catch (e) {
                console.error(e);
            }
        }

        function getWeatherIcon(code) {
            if (code === 0) return '☀️';
            if (code === 1 || code === 2) return '🌤️';
            if (code === 3) return '☁️';
            if (code >= 51 && code <= 67) return '🌧️';
            return '🌡️';
        }

        async function updateNews(forceFresh = false) {
            const container = document.getElementById('vg-news');
            try {
                const endpoint = forceFresh ? `${NEWS_API_URL}?refresh=1&t=${Date.now()}` : `${NEWS_API_URL}?t=${Date.now()}`;
                const resp = await fetch(endpoint, { cache: 'no-store' });
                if (!resp.ok) throw new Error('Feil fra nyhets-API');
                const data = await resp.json();
                const articles = Array.isArray(data.articles) ? data.articles.slice(0, MAX_NEWS_ARTICLES) : [];

                if (!articles.length) {
                    container.innerHTML = '<div style="padding:12px;color:var(--muted)">Ingen nyheter tilgjengelig</div>';
                    return;
                }

                const list = document.createElement('div');
                list.className = 'news-list';

                for (const art of articles) {
                    const a = document.createElement('a');
                    a.href = art.link || '#';
                    a.className = 'news-item';
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';

                    if (art.image) {
                        const img = document.createElement('img');
                        img.className = 'news-thumb';
                        img.src = art.image;
                        img.alt = art.title || '';
                        a.appendChild(img);
                    }

                    const meta = document.createElement('div');
                    meta.style.flex = '1';

                    const t = document.createElement('div');
                    t.className = 'news-title';
                    t.textContent = art.title || 'Uten tittel';
                    meta.appendChild(t);

                    if (art.pubDate) {
                        const dt = document.createElement('div');
                        dt.className = 'news-time';
                        const d = new Date(art.pubDate);
                        dt.textContent = isNaN(d.getTime()) ? art.pubDate : d.toLocaleString('no-NO', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
                        meta.appendChild(dt);
                    }

                    a.appendChild(meta);
                    list.appendChild(a);
                }

                container.innerHTML = '';
                container.appendChild(list);
            } catch (e) {
                console.error('Feil ved henting av nyheter:', e);
                const el = document.getElementById('vg-news');
                if (el) el.innerHTML = '<div style="padding:12px;color:var(--muted)">Kunne ikke hente nyheter</div>';
            }
        }

        updateWeather();
        updateNews();
        setInterval(updateWeather, WEATHER_INTERVAL);
        setInterval(updateNews, NEWS_INTERVAL);
    </script>

</body>

</html>
