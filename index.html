<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Streaming HUB</title>

    <meta name="theme-color" content="#060b12">
    <meta name="description" content="Streaming HUB med strømmetjenester, vær og siste nyheter fra VG.">

    <style>
        :root {
            --bg: #030d17;
            --bg-2: #081821;
            --panel: rgba(17, 24, 39, 0.7);
            --panel-soft: rgba(17, 24, 39, 0.9);
            --tile: rgba(18, 31, 45, 0.92);
            --tile-alt: rgba(14, 20, 31, 0.8);
            --text: #eef5ff;
            --muted: rgba(255,255,255,0.65);
            --muted-2: rgba(255,255,255,0.38);
            --line: rgba(255,255,255,0.05);
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 18px 26px 12px;
        }

        .page {
            width: 100%;
            max-width: 1460px;
            min-height: calc(100vh - 30px);
        }

        .layout {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr) 320px;
            gap: 32px;
            align-items: start;
        }

        .weather-area {
            padding-top: 18px;
            min-height: 420px;
        }

        .weather-head {
            margin: 0 0 18px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
        }

        .weather-box {
            margin-top: 8px;
            width: 100%;
            max-width: 220px;
            color: var(--text);
            background: transparent;
            border: none;
        }

        .weather-temp-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .weather-temp {
            font-size: 4.2rem;
            line-height: 0.95;
            font-weight: 400;
            letter-spacing: -0.06em;
            display: flex;
            align-items: flex-start;
        }

        .weather-temp .degree {
            font-size: 1.25rem;
            display: inline-block;
            transform: translateY(10px);
            margin-left: 2px;
        }

        .weather-feels {
            color: var(--muted);
            font-size: 1.05rem;
            margin-top: 8px;
        }

        .weather-meta {
            margin-top: 26px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 12px;
            color: var(--muted);
            font-size: 0.98rem;
        }

        .weather-meta strong {
            display: block;
            color: var(--text);
            font-size: 0.92rem;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .weather-updated {
            margin-top: 28px;
            font-size: 0.8rem;
            color: var(--muted-2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            max-width: 220px;
        }

        .weather-updated button,
        .news-footer button {
            background: rgba(255,255,255,0.02);
            color: #dfeeff;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 6px 10px;
            font: inherit;
            font-size: 0.76rem;
            cursor: pointer;
        }

        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 6px;
        }

        h1.title {
            margin: 0;
            font-size: 4rem;
            line-height: 1.1;
            letter-spacing: -0.06em;
            font-weight: 800;
            color: var(--text);
            text-align: center;
        }

        .services-block {
            width: 100%;
            margin-top: 26px;
            padding-right: 10px;
        }

        .section-header {
            margin: 0 0 14px;
            font-size: 1rem;
            color: var(--muted);
            font-weight: 700;
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(120px, 1fr));
            gap: 18px 22px;
            width: 100%;
            max-width: 700px;
        }

        .service-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 118px;
            border-radius: 10px;
            background: var(--tile);
            border: 1px solid var(--line);
            text-decoration: none;
            color: var(--text);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.01);
            padding: 12px 10px 10px;
            transition: transform 0.12s ease, filter 0.12s ease;
        }

        .service-card:hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
        }

        .service-logo {
            width: 54px;
            height: 54px;
            object-fit: contain;
            display: block;
            margin-bottom: 8px;
        }

        .service-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f0f5ff;
        }

        .news-area {
            padding-top: 10px;
            min-height: 100%;
        }

        .news-panel {
            width: 100%;
            min-height: 780px;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 0;
        }

        .news-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .news-header h2 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .news-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            text-decoration: none;
            min-height: 72px;
            padding: 0 0 8px;
            border-bottom: 1px solid var(--line);
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-thumb {
            width: 76px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: rgba(255,255,255,0.06);
            flex-shrink: 0;
        }

        .news-text {
            flex: 1;
            min-width: 0;
        }

        .news-title {
            font-size: 0.92rem;
            line-height: 1.3;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .news-time {
            color: var(--muted-2);
            font-size: 0.74rem;
            margin-top: 5px;
        }

        .news-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            color: var(--muted-2);
            font-size: 0.8rem;
            padding-top: 8px;
            border-top: 1px solid var(--line);
        }

        .bottom-text {
            margin-top: 22px;
            border-top: 1px solid rgba(255,255,255,0.04);
            padding-top: 8px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
        }

        .bottom-text a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
        }

        @media (max-width: 1100px) {
            .layout {
                grid-template-columns: 200px 1fr 280px;
                gap: 20px;
            }
            .service-grid {
                grid-template-columns: repeat(3, minmax(110px, 1fr));
            }
            h1.title { font-size: 3.1rem; }
        }

        @media (max-width: 768px) {
            body { padding: 14px; }
            .layout {
                grid-template-columns: 1fr;
            }
            .weather-area,
            .news-area { min-height: auto; }
            .service-grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
            h1.title { font-size: 2.5rem; }
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="layout">
            <aside class="weather-area">
                <div class="weather-head">Været</div>

                <div class="weather-box">
                    <div class="weather-temp-row">
                        <div id="weather-icon" style="font-size:3.8rem; line-height:1;">☁️</div>
                        <div class="weather-temp" id="temperature">14<span class="degree">°</span></div>
                    </div>

                    <div class="weather-feels" id="feels-like">Føles som 11°</div>

                    <div class="weather-meta">
                        <div><strong>Vind:</strong> <span id="wind">28.1 km/t</span></div>
                        <div><strong>Luftfuktighet:</strong> <span id="humidity">88 %</span></div>
                    </div>

                    <div class="weather-updated">
                        <span id="weather-updated">Værdato: 14:15</span>
                        <button id="refresh-weather" type="button">Oppdater</button>
                    </div>
                </div>
            </aside>

            <main class="main">
                <h1 class="title">Streaming HUB</h1>

                <div class="services-block">
                    <div class="section-header">Strømmetjenester</div>
                    <div class="service-grid">
                        <a class="service-card" href="spotify:">
                            <img class="service-logo" src="Images/spotify.png" alt="Spotify">
                            <div class="service-label">Spotify</div>
                        </a>

                        <a class="service-card" href="https://www.youtube.com">
                            <img class="service-logo" src="Images/youtube.png" alt="YouTube">
                            <div class="service-label">YouTube</div>
                        </a>

                        <a class="service-card" href="https://www.twitch.tv">
                            <img class="service-logo" src="Images/twitch.png" alt="Twitch">
                            <div class="service-label">Twitch</div>
                        </a>

                        <a class="service-card" href="https://www.netflix.com">
                            <img class="service-logo" src="Images/netflix.png" alt="Netflix">
                            <div class="service-label">Netflix</div>
                        </a>

                        <a class="service-card" href="https://www.max.com">
                            <img class="service-logo" src="Images/max.png" alt="Max">
                            <div class="service-label">Max</div>
                        </a>

                        <a class="service-card" href="https://www.disneyplus.com">
                            <img class="service-logo" src="Images/disneypluss.png" alt="Disney+">
                            <div class="service-label">Disney+</div>
                        </a>

                        <a class="service-card" href="https://www.primevideo.com">
                            <img class="service-logo" src="Images/prime.png" alt="Prime Video">
                            <div class="service-label">Prime Video</div>
                        </a>

                        <a class="service-card" href="https://tv.nrk.no">
                            <img class="service-logo" src="Images/nrk.png" alt="NRK TV">
                            <div class="service-label">NRK TV</div>
                        </a>

                        <a class="service-card" href="https://play.tv2.no">
                            <img class="service-logo" src="Images/tv2.png" alt="TV 2 Play">
                            <div class="service-label">TV 2 Play</div>
                        </a>

                        <a class="service-card" href="https://www.viaplay.no">
                            <img class="service-logo" src="Images/viaplay.png" alt="Viaplay">
                            <div class="service-label">Viaplay</div>
                        </a>

                        <a class="service-card" href="https://www.strim.no">
                            <img class="service-logo" src="Images/strim.png" alt="Strim">
                            <div class="service-label">Strim</div>
                        </a>

                        <a class="service-card" href="https://www.yr.no">
                            <img class="service-logo" src="Images/yr.png" alt="Yr">
                            <div class="service-label">Yr</div>
                        </a>
                    </div>
                </div>
            </main>

            <aside class="news-area">
                <div class="news-panel">
                    <div class="news-header">
                        <h2>Vg</h2>
                    </div>

                    <div id="vg-news" class="news-list" aria-live="polite"></div>

                    <div class="news-footer">
                        <span id="news-updated">Hentet fra VG: --:--</span>
                        <button id="refresh-news" type="button">Oppdater</button>
                    </div>
                </div>
            </aside>
        </div>

        <div class="bottom-text">
            <a href="https://www.vg.no/nyheter/i/MKp8i/il-ai-gojere-at-mange-staar-uten-jobb" target="_blank" rel="noopener noreferrer">https://www.vg.no/nyheter/i/MKp8i/il-ai-gojere-at-mange-staar-uten-jobb</a>
        </div>
    </div>

    <script>
        const WEATHER = {
            city: 'Oslo',
            latitude: 59.9139,
            longitude: 10.7522
        };

        const WEATHER_INTERVAL = 5 * 60 * 1000;
        const NEWS_API_URL = 'https://streaminghub-news.eskil-sundby.workers.dev/news';
        const NEWS_INTERVAL = 15 * 60 * 1000;
        const MAX_NEWS_ARTICLES = 5;

        async function updateWeather() {
            const tempEl = document.getElementById('temperature');
            const feelsEl = document.getElementById('feels-like');
            const windEl = document.getElementById('wind');
            const humEl = document.getElementById('humidity');
            const updatedEl = document.getElementById('weather-updated');
            const iconEl = document.getElementById('weather-icon');

            try {
                const url = 'https://api.open-meteo.com/v1/forecast' +
                    `?latitude=${WEATHER.latitude}` +
                    `&longitude=${WEATHER.longitude}` +
                    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m' +
                    '&timezone=Europe%2FOslo';

                const response = await fetch(url);
                if (!response.ok) throw new Error('Værserveren svarte med feil');

                const data = await response.json();
                const current = data?.current;
                if (!current) throw new Error('Ingen værdata');

                const temp = Number.isFinite(current.temperature_2m) ? Math.round(current.temperature_2m) : '--';
                const feels = Number.isFinite(current.apparent_temperature) ? Math.round(current.apparent_temperature) : temp;
                const weatherCode = current.weather_code ?? 0;

                if (tempEl) tempEl.innerHTML = `${temp}<span class="degree">°</span>`;
                if (feelsEl) feelsEl.textContent = `Føles som ${feels}°`;
                if (windEl) windEl.textContent = `${current.wind_speed_10m ?? '--'} km/t`;
                if (humEl) humEl.textContent = `${current.relative_humidity_2m ?? '--'} %`;
                if (iconEl) iconEl.textContent = getWeatherIcon(weatherCode);

                const weatherTime = new Date(current.time);
                if (updatedEl && !isNaN(weatherTime.getTime())) {
                    updatedEl.textContent = 'Værdato: ' + weatherTime.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
                }
            } catch (error) {
                console.error('Weather fetch failed:', error);
                if (tempEl) tempEl.innerHTML = '--<span class="degree">°</span>';
                if (feelsEl) feelsEl.textContent = 'Føles som --°';
                if (updatedEl) updatedEl.textContent = 'Værdata utilgjengelig';
            }
        }

        function getWeatherIcon(code) {
            if (code === 0) return '☀️';
            if (code === 1 || code === 2) return '🌤️';
            if (code === 3) return '☁️';
            if (code >= 51 && code <= 67) return '🌧️';
            if (code >= 71 && code <= 77) return '❄️';
            if (code >= 80 && code <= 82) return '🌦️';
            if (code >= 95) return '⛈️';
            return '🌡️';
        }

        async function updateNews(forceFresh = false) {
            const container = document.getElementById('vg-news');
            const updatedEl = document.getElementById('news-updated');
            const refreshBtn = document.getElementById('refresh-news');

            try {
                const endpoint = forceFresh
                    ? `${NEWS_API_URL}?refresh=1&t=${Date.now()}`
                    : `${NEWS_API_URL}?t=${Date.now()}`;

                const response = await fetch(endpoint, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Nyhetsserveren svarte ${response.status}`);
                }

                const data = await response.json();
                const articles = Array.isArray(data.articles) ? data.articles.slice(0, MAX_NEWS_ARTICLES) : [];

                if (!container) return;

                if (!articles.length) {
                    container.innerHTML = '<div class="news-item"><div class="news-text"><div class="news-title">Ingen nyheter tilgjengelig</div></div></div>';
                    if (updatedEl) updatedEl.textContent = 'Ingen nyheter';
                    return;
                }

                const fragment = document.createDocumentFragment();
                articles.forEach(article => {
                    const link = document.createElement('a');
                    link.href = article.link || 'https://www.vg.no';
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.className = 'news-item';

                    if (article.image) {
                        const img = document.createElement('img');
                        img.src = article.image;
                        img.alt = article.title || '';
                        img.className = 'news-thumb';
                        link.appendChild(img);
                    }

                    const text = document.createElement('div');
                    text.className = 'news-text';

                    const title = document.createElement('div');
                    title.className = 'news-title';
                    title.textContent = article.title || 'Uten tittel';
                    text.appendChild(title);

                    if (article.pubDate) {
                        const time = document.createElement('div');
                        time.className = 'news-time';
                        const dt = new Date(article.pubDate);
                        time.textContent = Number.isNaN(dt.getTime())
                            ? article.pubDate
                            : dt.toLocaleString('no-NO', {
                                day: '2-digit', month: '2-digit',
                                hour: '2-digit', minute: '2-digit'
                            });
                        text.appendChild(time);
                    }

                    link.appendChild(text);
                    fragment.appendChild(link);
                });

                container.innerHTML = '';
                container.appendChild(fragment);

                if (updatedEl) {
                    const generated = data.updatedAt ? new Date(data.updatedAt) : null;
                    const timeLabel = generated && !Number.isNaN(generated.getTime())
                        ? generated.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' })
                        : 'ukjent tidspunkt';
                    updatedEl.textContent = `${data.stale ? 'Sist lagret' : 'Hentet fra VG'}: ${timeLabel}`;
                }
            } catch (error) {
                console.error('News fetch failed:', error);
                if (container) {
                    container.innerHTML = '<div class="news-item"><div class="news-text"><div class="news-title">Kunne ikke hente nyheter</div></div></div>';
                }
                if (updatedEl) updatedEl.textContent = 'Feil ved oppdatering';
            } finally {
                if (refreshBtn) {
                    refreshBtn.disabled = false;
                    refreshBtn.textContent = 'Oppdater';
                }
            }
        }

        document.getElementById('refresh-weather').addEventListener('click', function () {
            this.disabled = true;
            this.textContent = 'Oppdaterer...';
            updateWeather().finally(() => {
                this.disabled = false;
                this.textContent = 'Oppdater';
            });
        });

        document.getElementById('refresh-news').addEventListener('click', function () {
            this.disabled = true;
            this.textContent = 'Henter...';
            updateNews(true).finally(() => {
                this.disabled = false;
                this.textContent = 'Oppdater';
            });
        });

        updateWeather();
        updateNews();
        setInterval(updateWeather, WEATHER_INTERVAL);
        setInterval(updateNews, NEWS_INTERVAL);
    </script>
</body>

</html>
