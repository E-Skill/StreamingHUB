<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Streaming HUB</title>

    <meta name="theme-color" content="#060b12">
    <meta name="description" content="Streaming HUB med strømmetjenester, vær og siste nyheter fra NRK.">

    <style>
        :root {
            --bg: #030d17;
            --bg-2: #081821;
            --panel: rgba(17, 24, 39, 0.7);
            --panel-soft: rgba(17, 24, 39, 0.9);
            --tile: rgba(18, 31, 45, 0.92);
            --tile-alt: rgba(14, 20, 31, 0.8);
            --text: #eef5ff;
            --muted: rgba(255,255,255,0.65);
            --muted-2: rgba(255,255,255,0.38);
            --line: rgba(255,255,255,0.05);
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 18px 22px 10px;
        }

        .page {
            width: 100%;
            max-width: 1460px;
            min-height: calc(100vh - 30px);
        }

        .layout {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr) 360px;
            gap: 26px;
            align-items: start;
        }

        /* Weather column */
        .weather-area {
            padding-top: 16px;
            min-height: calc(100vh - 36px);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .weather-head {
            margin: 0 0 18px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .weather-location {
            font-size: 0.85rem;
            color: var(--muted);
            font-weight: 500;
        }

        .weather-box {
            width: 100%;
            max-width: 220px;
            color: var(--text);
            background: transparent;
            border: none;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1 1 auto;
        }

        .weather-temp-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
        }

        .weather-temp {
            font-size: 3.2rem;
            line-height: 0.96;
            font-weight: 700;
            letter-spacing: -0.06em;
            display: flex;
            align-items: flex-start;
        }

        .weather-temp .degree {
            font-size: 1.05rem;
            display: inline-block;
            transform: translateY(12px);
            margin-left: 2px;
        }

        .weather-feels {
            color: var(--muted);
            font-size: 1.0rem;
            margin-top: 8px;
        }

        .weather-meta {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 12px;
            color: var(--muted);
            font-size: 0.97rem;
        }

        .weather-meta strong {
            display: block;
            color: var(--text);
            font-size: 0.9rem;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .weather-updated {
            margin-top: 12px;
            font-size: 0.82rem;
            color: var(--muted-2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            max-width: 220px;
        }

        .weather-updated button,
        .news-footer button {
            background: rgba(255,255,255,0.02);
            color: #dfeeff;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            padding: 6px 10px;
            font: inherit;
            font-size: 0.76rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .weather-updated button:hover,
        .news-footer button:hover {
            background: rgba(255,255,255,0.08);
        }

        .hourly-forecast {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
            padding-bottom: 6px;
            overflow: visible;
        }

        .hour-card {
            width: 100%;
            max-width: 100%;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            padding: 10px 12px;
            text-align: left;
            font-size: 0.95rem;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .hour-left { display:flex; align-items:center; gap:10px; }
        .hour-icon { font-size: 1.2rem; }
        .hour-temp { font-weight: 700; font-size: 1rem; }

        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 8px;
            min-height: calc(100vh - 36px);
        }

        h1.title {
            margin: 6px 0 0;
            font-size: 2.4rem;
            line-height: 1.05;
            letter-spacing: -0.03em;
            font-weight: 800;
            color: var(--text);
            text-align: center;
        }

        .services-block {
            width: 100%;
            margin-top: 18px;
            padding-right: 10px;
            display:flex;
            justify-content:center;
        }

        .section-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 700px;
            margin-bottom: 12px;
        }

        .section-header {
            margin: 0;
            font-size: 1rem;
            color: var(--muted);
            font-weight: 700;
        }

        .recipe-nav-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
            transition: color 0.2s;
        }
        .recipe-nav-btn:hover {
            color: var(--text);
        }

        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px 28px;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            justify-content: center;
            justify-items: center;
        }

        .service-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 160px;
            min-height: 140px;
            border-radius: 10px;
            background: rgba(18, 31, 45, 0.92);
            border: 1px solid rgba(255,255,255,0.04);
            text-decoration: none;
            color: var(--text);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.01);
            padding: 14px 12px 12px;
            transition: transform 0.12s ease, filter 0.12s ease;
        }

        .service-card:hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
        }

        .service-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            display: block;
            margin-bottom: 12px;
        }

        .service-label {
            font-size: 0.95rem;
            font-weight: 600;
            color: #f0f5ff;
        }

        .news-area {
            padding-top: 10px;
            min-height: calc(100vh - 36px);
            display:flex;
            flex-direction:column;
        }

        .news-panel {
            width: 100%;
            min-height: calc(100vh - 36px);
            background: transparent;
            border: none;
            color: var(--text);
            padding: 0;
            display:flex;
            flex-direction:column;
        }

        .news-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            margin-bottom: 12px;
            padding-right: 6px;
        }

        .news-brand-logo {
            width: 40px;
            height: 40px;
            object-fit: contain;
            display: block;
            flex-shrink: 0;
        }

        .news-header h2 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: visible;
            padding-right: 6px;
            flex: 1 1 auto;
        }

        .news-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text);
            text-decoration: none;
            min-height: 86px;
            padding: 6px 0;
            border-bottom: 1px solid var(--line);
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-thumb {
            width: 96px;
            height: 72px;
            border-radius: 8px;
            object-fit: cover;
            background: rgba(255,255,255,0.06);
            flex-shrink: 0;
        }

        .news-text {
            flex: 1;
            min-width: 0;
        }

        .news-title {
            font-size: 0.98rem;
            line-height: 1.3;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .news-time {
            color: var(--muted-2);
            font-size: 0.78rem;
            margin-top: 6px;
        }

        .news-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            color: var(--muted-2);
            font-size: 0.8rem;
            padding-top: 8px;
            border-top: 1px solid var(--line);
        }

        /* Modaler for oppskrifter */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #111827;
            color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-content::-webkit-scrollbar {
            display: none;
            width: 0;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .close-btn:hover { background: #333; }
        .modal-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--line);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .add-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .add-btn:hover { background: #0056b3; }

        /* Søk og kategorier */
        .search-container {
            margin-bottom: 12px;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: #081821;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .search-input:focus {
            outline: none;
            border-color: #007bff;
        }
        .category-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 12px;
            scrollbar-width: none;
        }
        .category-bar::-webkit-scrollbar { display: none; }
        .cat-chip {
            background: rgba(255,255,255,0.06);
            color: var(--muted);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .cat-chip.active, .cat-chip:hover {
            background: #007bff;
            color: #fff;
            border-color: #007bff;
        }
        .recipe-badge {
            display: inline-block;
            background: rgba(0, 123, 255, 0.2);
            color: #4da6ff;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
            margin-right: 6px;
            border: 1px solid rgba(77, 166, 255, 0.3);
        }
        .recipe-badge-time {
            display: inline-block;
            background: rgba(40, 167, 69, 0.2);
            color: #5cdb95;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
            border: 1px solid rgba(92, 219, 149, 0.3);
        }

        .recipe-list { display: flex; flex-direction: column; gap: 10px; }
        .recipe-card-item {
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.04);
            transition: background 0.2s;
        }
        .recipe-card-item:hover { background: rgba(255,255,255,0.07); }
        .recipe-thumb {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            background: #222;
        }
        .recipe-info h3 { margin: 0 0 3px 0; color: #4da6ff; font-size: 1.1em; }
        .recipe-info p { margin: 0; color: var(--muted); font-size: 0.85em; }
        .ai-section {
            margin-top: 25px;
            text-align: center;
            border-top: 1px solid var(--line);
            padding-top: 20px;
        }
        .ai-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .ai-btn:hover { background: #218838; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 0.9em; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
